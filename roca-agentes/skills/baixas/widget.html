<h2 class="sr-only">Baixas do dia: pagamentos do extrato com parcela para dar baixa, várias parcelas, sem lançamento e já baixados</h2>
<style>
.mc{background:var(--surface-1);border-radius:var(--radius);padding:12px 14px}.mc p{margin:0}
.lb{font-size:13px;color:var(--text-secondary)}.nb{font-size:22px;font-weight:500}
.sec{margin:1.25rem 0 .5rem;font-size:15px;font-weight:500}
.ln{display:grid;gap:10px;align-items:center;padding:8px 0;border-bottom:.5px solid var(--border);font-size:14px}
select{width:100%}
</style>
<div id="metricas" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;padding-top:.5rem"></div>
<div id="dar"></div>
<div id="varias"></div>
<div id="sem"></div>
<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:1rem">
<button onclick="openLink('https://acessar.maiscontroleerp.com.br/#/payable-installments')"><i class="ti ti-external-link" aria-hidden="true"></i> Abrir Pagamentos no Mais Controle</button>
<button id="ok" style="background:var(--fill-primary);color:var(--on-primary);border:none">Registrar o que fiz ↗</button>
</div>
<script>
const D = __DADOS__;
const brl = v => v == null ? "—" : v.toLocaleString("pt-BR", {style: "currency", currency: "BRL"});
const el = (tag, attrs = {}, ...filhos) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === "style") e.style.cssText = v; else if (k === "class") e.className = v; else if (k.includes("-")) e.setAttribute(k, v); else e[k] = v; } filhos.forEach(f => e.append(f)); return e; };
const por = s => D.itens.filter(i => i.situacao === s);
const m = document.getElementById("metricas");
[["Dar baixa", por("DAR BAIXA").length], ["Várias parcelas", por("VÁRIAS PARCELAS").length], ["Sem lançamento", por("SEM LANÇAMENTO").length], ["Já baixados", por("JÁ BAIXADO").length]]
  .forEach(([r, v]) => m.append(el("div", {class: "mc"}, el("p", {class: "lb", textContent: r}), el("p", {class: "nb", textContent: v}))));
const marcas = [];
const secao = (id, titulo) => { const c = document.getElementById(id); c.append(el("p", {class: "sec", textContent: titulo})); return c; };
if (por("DAR BAIXA").length) {
  const c = secao("dar", "Dar baixa no Mais Controle");
  por("DAR BAIXA").forEach(i => {
    const p = i.parcelas[0];
    const cb = el("input", {type: "checkbox", "aria-label": "Baixa feita: " + i.favorecido});
    marcas.push(["baixa feita", i, cb]);
    c.append(el("div", {class: "ln", style: "grid-template-columns:24px minmax(0,1.2fr) 90px minmax(0,1.6fr)"},
      cb, el("span", {textContent: i.favorecido}), el("span", {textContent: brl(i.valor)}), el("span", {class: "lb", textContent: "vence " + p.vencimento + " · " + (p.descricao || "") + " · " + (p.obra || "")})));
  });
}
if (por("VÁRIAS PARCELAS").length) {
  const c = secao("varias", "Qual parcela foi paga");
  por("VÁRIAS PARCELAS").forEach(i => {
    const s = el("select", {"aria-label": "Parcela de " + i.favorecido});
    s.append(el("option", {value: "", textContent: "Escolha a parcela"}));
    i.parcelas.forEach((p, k) => s.append(el("option", {value: String(k), textContent: "vence " + p.vencimento + " · " + (p.descricao || p.obra)})));
    marcas.push(["parcela", i, s]);
    c.append(el("div", {class: "ln", style: "grid-template-columns:minmax(0,1.2fr) 90px minmax(0,1.6fr)"},
      el("span", {textContent: i.favorecido}), el("span", {textContent: brl(i.valor)}), s));
  });
}
if (por("SEM LANÇAMENTO").length) {
  const c = secao("sem", "Sem lançamento (precisa lançar)");
  por("SEM LANÇAMENTO").forEach(i => c.append(el("div", {class: "ln", style: "grid-template-columns:minmax(0,1.2fr) 90px minmax(0,1.6fr)"},
    el("span", {textContent: i.favorecido}), el("span", {textContent: brl(i.valor)}), el("span", {class: "lb", textContent: i.descricao || i.data}))));
}
document.getElementById("ok").onclick = () => {
  const feitas = marcas.filter(([t, , x]) => t === "baixa feita" && x.checked).map(([, i]) => i.favorecido + " " + brl(i.valor));
  const escolhidas = marcas.filter(([t, , x]) => t === "parcela" && x.value !== "").map(([, i, x]) => i.favorecido + " = parcela que vence " + i.parcelas[+x.value].vencimento);
  sendPrompt("Baixas: " + (feitas.length ? "feitas " + feitas.join("; ") : "nenhuma marcada") + (escolhidas.length ? ". Parcelas: " + escolhidas.join("; ") : "") + ".");
};
</script>
